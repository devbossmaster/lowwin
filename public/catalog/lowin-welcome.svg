<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720"><rect width="1200" height="720" fill="#fff"/><text x="72" y="115" fill="#172720" font-family="DM Sans, sans-serif" font-weight="700" font-size="72">lowin.</text><text x="72" y="227" fill="#172720" font-family="DM Sans, sans-serif" font-weight="600" font-size="54">A little different wins.</text><text x="72" y="289" fill="#54665c" font-family="DM Sans, sans-serif" font-size="27">The lowest point bid chosen only once wins.</text><rect x="72" y="355" width="156" height="164" rx="16" fill="#f3f6f1"/><text x="150" y="448" text-anchor="middle" fill="#172720" font-family="DM Sans, sans-serif" font-weight="700" font-size="64">1</text><text x="150" y="490" text-anchor="middle" fill="#405246" font-family="DM Sans, sans-serif" font-size="21">points</text><rect x="250" y="355" width="156" height="164" rx="16" fill="#f3f6f1"/><text x="328" y="448" text-anchor="middle" fill="#172720" font-family="DM Sans, sans-serif" font-weight="700" font-size="64">1</text><text x="328" y="490" text-anchor="middle" fill="#405246" font-family="DM Sans, sans-serif" font-size="21">points</text><rect x="428" y="355" width="156" height="164" rx="16" fill="#a3e635"/><text x="506" y="448" text-anchor="middle" fill="#172720" font-family="DM Sans, sans-serif" font-weight="700" font-size="64">2</text><text x="506" y="490" text-anchor="middle" fill="#405246" font-family="DM Sans, sans-serif" font-size="21">points</text><rect x="606" y="355" width="156" height="164" rx="16" fill="#f3f6f1"/><text x="684" y="448" text-anchor="middle" fill="#172720" font-family="DM Sans, sans-serif" font-weight="700" font-size="64">3</text><text x="684" y="490" text-anchor="middle" fill="#405246" font-family="DM Sans, sans-serif" font-size="21">points</text><rect x="784" y="355" width="156" height="164" rx="16" fill="#f3f6f1"/><text x="862" y="448" text-anchor="middle" fill="#172720" font-family="DM Sans, sans-serif" font-weight="700" font-size="64">3</text><text x="862" y="490" text-anchor="middle" fill="#405246" font-family="DM Sans, sans-serif" font-size="21">points</text><rect x="962" y="355" width="156" height="164" rx="16" fill="#f3f6f1"/><text x="1040" y="448" text-anchor="middle" fill="#172720" font-family="DM Sans, sans-serif" font-weight="700" font-size="64">4</text><text x="1040" y="490" text-anchor="middle" fill="#405246" font-family="DM Sans, sans-serif" font-size="21">points</text><text x="72" y="594" fill="#172720" font-family="DM Sans, sans-serif" font-size="31" font-weight="600">2 points wins in this example.</text><text x="72" y="646" fill="#54665c" font-family="DM Sans, sans-serif" font-size="23">1 and 3 repeat. 4 is unique, but higher. Example only.</text></svg>
name: Checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lowin_test
          POSTGRES_PASSWORD: fixture_only
          POSTGRES_DB: lowin_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lowin_test -d lowin_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://lowin_test:fixture_only@127.0.0.1:5432/lowin_test
      DATABASE_URL: postgresql://lowin_test:fixture_only@127.0.0.1:5432/lowin_test
      DIRECT_URL: postgresql://lowin_test:fixture_only@127.0.0.1:5432/lowin_test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: node scripts/run-db-tests.mjs unit
      - run: npm run typecheck
      - run: npm run build
      # Current customer paths are exercised in browser-redesign below.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-checks
          path: |
            test-results/
            playwright-report/
          retention-days: 7
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=low
  static-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: pip install semgrep==1.178.0
      - run: semgrep scan --config p/ci --config p/secrets --metrics=off --error --json-output=security-results.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: security-results
          path: security-results.json
          retention-days: 7
  browser-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lowin_test
          POSTGRES_PASSWORD: fixture_only
          POSTGRES_DB: lowin_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lowin_test -d lowin_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://lowin_test:fixture_only@127.0.0.1:5432/lowin_test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npx playwright install --with-deps chromium
      - run: node scripts/run-db-tests.mjs admin
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: admin-workspace
          path: |
            test-results/
            docs/redesign/screenshots/master-guide-admin/
          retention-days: 7
  browser-redesign:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lowin_test
          POSTGRES_PASSWORD: fixture_only
          POSTGRES_DB: lowin_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lowin_test -d lowin_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://lowin_test:fixture_only@127.0.0.1:5432/lowin_test
      DATABASE_URL: postgresql://lowin_test:fixture_only@127.0.0.1:5432/lowin_test
      DIRECT_URL: postgresql://lowin_test:fixture_only@127.0.0.1:5432/lowin_test
      REDESIGN_PRODUCTION: '1'
      REDESIGN_TLS_KEY: /tmp/lowwin-redesign-key.pem
      REDESIGN_TLS_CERT: /tmp/lowwin-redesign-cert.pem
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npx playwright install --with-deps chromium
      # Covers the redesigned navigation, sheets, receipt, zero balance, auth,
      # language, keyboard viewport, notifications and private reconciliation.
      # Full legacy rule/payment/staff invariants execute in foundation Vitest.
      # Slow-network measurements must use shipped bundles, not dev/HMR code.
      - run: >-
          openssl req -x509 -newkey rsa:2048 -nodes
          -keyout "$REDESIGN_TLS_KEY" -out "$REDESIGN_TLS_CERT"
          -days 1 -subj '/CN=localhost'
          -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1'
      - run: node scripts/run-db-tests.mjs redesign
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mobile-redesign
          path: |
            test-results/
            docs/redesign/screenshots/
          retention-days: 7
  browser-chapa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lowin_test
          POSTGRES_PASSWORD: fixture_only
          POSTGRES_DB: lowin_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lowin_test -d lowin_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://lowin_test:fixture_only@127.0.0.1:5432/lowin_test
      DATABASE_URL: postgresql://lowin_test:fixture_only@127.0.0.1:5432/lowin_test
      DIRECT_URL: postgresql://lowin_test:fixture_only@127.0.0.1:5432/lowin_test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npx playwright install --with-deps chromium
      # Creates a fresh loopback database and migrates it. The spec creates its
      # own synthetic fixtures and mocks payment responses; no merchant keys.
      - run: node scripts/run-db-tests.mjs chapa
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: chapa-checkout-ui
          path: test-results/chapa-ui/
          retention-days: 7
